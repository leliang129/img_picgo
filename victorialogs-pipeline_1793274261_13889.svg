<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0d203a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047eb8"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea8600"/>
    </marker>
  </defs>

  <text x="720" y="50" text-anchor="middle" font-family="MiSans,'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="600" fill="#0d203a">Vector + VictoriaLogs + Grafana 日志链路</text>
  <text x="720" y="80" text-anchor="middle" font-family="MiSans,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#55657a">采集清洗 → 存储查询 → 可视化与告警</text>

  <!-- 日志来源 -->
  <g filter="url(#shadow)">
    <rect x="40" y="150" width="200" height="220" rx="12" fill="#f7fbff" stroke="#94d4fd" stroke-width="1.5"/>
  </g>
  <text x="140" y="184" text-anchor="middle" font-family="MiSans,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#0d203a">日志来源</text>
  <g font-family="MiSans,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#33415c">
    <rect x="60" y="202" width="160" height="36" rx="8" fill="#ffffff" stroke="#7ccdfb"/>
    <text x="140" y="225" text-anchor="middle">应用容器 stdout</text>
    <rect x="60" y="248" width="160" height="36" rx="8" fill="#ffffff" stroke="#7ccdfb"/>
    <text x="140" y="271" text-anchor="middle">主机文件 / nginx</text>
    <rect x="60" y="294" width="160" height="36" rx="8" fill="#ffffff" stroke="#7ccdfb"/>
    <text x="140" y="317" text-anchor="middle">journald / syslog</text>
  </g>

  <!-- Vector -->
  <g filter="url(#shadow)">
    <rect x="330" y="150" width="250" height="220" rx="12" fill="#ffffff" stroke="#12affa" stroke-width="2"/>
  </g>
  <rect x="330" y="150" width="6" height="220" rx="3" fill="#12affa"/>
  <text x="455" y="188" text-anchor="middle" font-family="MiSans,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="600" fill="#0d203a">Vector</text>
  <text x="455" y="212" text-anchor="middle" font-family="MiSans,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#55657a">单二进制采集代理</text>
  <g font-family="MiSans,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#33415c">
    <rect x="352" y="228" width="206" height="36" rx="8" fill="#eef8ff" stroke="#7ccdfb"/>
    <text x="455" y="251" text-anchor="middle">sources：file / docker / journald</text>
    <rect x="352" y="272" width="206" height="36" rx="8" fill="#eef8ff" stroke="#7ccdfb"/>
    <text x="455" y="295" text-anchor="middle">transforms：VRL 解析富化</text>
    <rect x="352" y="316" width="206" height="36" rx="8" fill="#eef8ff" stroke="#7ccdfb"/>
    <text x="455" y="339" text-anchor="middle">sinks：批量写入下游</text>
  </g>

  <!-- VictoriaLogs -->
  <g filter="url(#shadow)">
    <rect x="670" y="150" width="260" height="220" rx="12" fill="#ffffff" stroke="#12affa" stroke-width="2"/>
  </g>
  <rect x="670" y="150" width="6" height="220" rx="3" fill="#7b61ff"/>
  <text x="800" y="188" text-anchor="middle" font-family="MiSans,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="600" fill="#0d203a">VictoriaLogs</text>
  <text x="800" y="212" text-anchor="middle" font-family="MiSans,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#55657a">单进程日志存储 · :9428</text>
  <g font-family="MiSans,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#33415c">
    <rect x="692" y="228" width="216" height="36" rx="8" fill="#eef8ff" stroke="#7ccdfb"/>
    <text x="800" y="251" text-anchor="middle">摄入：jsonline / ES _bulk</text>
    <rect x="692" y="272" width="216" height="36" rx="8" fill="#eef8ff" stroke="#7ccdfb"/>
    <text x="800" y="295" text-anchor="middle">LogsQL 查询语言</text>
    <rect x="692" y="316" width="216" height="36" rx="8" fill="#eef8ff" stroke="#7ccdfb"/>
    <text x="800" y="339" text-anchor="middle">高压缩 · 低资源占用</text>
  </g>

  <!-- Grafana -->
  <g filter="url(#shadow)">
    <rect x="1020" y="150" width="250" height="220" rx="12" fill="#ffffff" stroke="#12affa" stroke-width="2"/>
  </g>
  <rect x="1020" y="150" width="6" height="220" rx="3" fill="#f46800"/>
  <text x="1145" y="188" text-anchor="middle" font-family="MiSans,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="600" fill="#0d203a">Grafana</text>
  <text x="1145" y="212" text-anchor="middle" font-family="MiSans,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#55657a">victorialogs-datasource</text>
  <g font-family="MiSans,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#33415c">
    <rect x="1042" y="228" width="206" height="36" rx="8" fill="#eef8ff" stroke="#7ccdfb"/>
    <text x="1145" y="251" text-anchor="middle">Explore 即席检索</text>
    <rect x="1042" y="272" width="206" height="36" rx="8" fill="#eef8ff" stroke="#7ccdfb"/>
    <text x="1145" y="295" text-anchor="middle">日志 / 统计仪表盘</text>
    <rect x="1042" y="316" width="206" height="36" rx="8" fill="#eef8ff" stroke="#7ccdfb"/>
    <text x="1145" y="339" text-anchor="middle">Grafana 告警</text>
  </g>

  <!-- 主链路箭头 -->
  <g stroke="#047eb8" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="240" y1="260" x2="326" y2="260"/>
    <line x1="580" y1="260" x2="666" y2="260"/>
    <line x1="930" y1="260" x2="1016" y2="260"/>
  </g>
  <g font-family="MiSans,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#047eb8">
    <text x="283" y="248" text-anchor="middle">原始日志</text>
    <text x="623" y="248" text-anchor="middle">结构化批量写入</text>
    <text x="973" y="248" text-anchor="middle">LogsQL 查询</text>
  </g>

  <!-- 告警路径：vmalert -->
  <g filter="url(#shadow)">
    <rect x="670" y="470" width="260" height="96" rx="12" fill="#ffffff" stroke="#ea8600" stroke-width="1.5"/>
  </g>
  <rect x="670" y="470" width="6" height="96" rx="3" fill="#ea8600"/>
  <text x="800" y="510" text-anchor="middle" font-family="MiSans,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#0d203a">vmalert</text>
  <text x="800" y="536" text-anchor="middle" font-family="MiSans,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#55657a">LogsQL 告警规则周期评估</text>

  <g filter="url(#shadow)">
    <rect x="1020" y="470" width="250" height="96" rx="12" fill="#ffffff" stroke="#ea8600" stroke-width="1.5"/>
  </g>
  <rect x="1020" y="470" width="6" height="96" rx="3" fill="#ea8600"/>
  <text x="1145" y="510" text-anchor="middle" font-family="MiSans,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#0d203a">Alertmanager</text>
  <text x="1145" y="536" text-anchor="middle" font-family="MiSans,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#55657a">路由 / 静默 / 通知</text>

  <line x1="800" y1="370" x2="800" y2="464" stroke="#ea8600" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <line x1="930" y1="518" x2="1016" y2="518" stroke="#ea8600" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="812" y="420" font-family="MiSans,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#b45309">告警查询</text>
  <text x="973" y="506" text-anchor="middle" font-family="MiSans,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#b45309">触发告警</text>

  <!-- 底部注释 -->
  <rect x="40" y="610" width="1340" height="60" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="720" y="646" text-anchor="middle" font-family="MiSans,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#55657a">全部组件 Docker Compose 一键起 · 2C4G 可跑完整链路 · 指标侧可与 VictoriaMetrics / Prometheus 共存于同一 Grafana</text>
</svg>
